name: Production Environment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run coverage gate
        run: npm run test:coverage:prod

      - name: Verify coverage threshold
        run: |
          node -e "const fs=require('fs'); const gate=require('./coverage-gates.json').prod; const pct=JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8')).total.lines.pct; console.log('Coverage: '+pct+'% (gate: '+gate+'%)'); if(pct<gate){console.error('Coverage gate failed: '+pct+'% < '+gate+'%'); process.exit(1)}"

      - name: Build Docker image
        run: docker build -t pokenetes-api:${{ github.sha }} .
