name: Orchestrator Pipeline

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'orchestrator/**'
      - '.github/workflows/orchestrator-pipeline.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'orchestrator/**'
      - '.github/workflows/orchestrator-pipeline.yml'
  workflow_dispatch:

jobs:
  build-orchestrator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: orchestrator/package-lock.json

      - name: Install orchestrator dependencies
        working-directory: orchestrator
        run: npm ci

      - name: Build orchestrator
        working-directory: orchestrator
        run: npm run build

      - name: Build orchestrator image
        run: docker build -t pokenetes-orchestrator:${{ github.sha }} -f orchestrator/Dockerfile orchestrator

      - name: Push orchestrator image and restart pods
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY is missing. Skipping EKS deploy."
            exit 0
          fi
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 722500516562.dkr.ecr.us-east-1.amazonaws.com
          docker tag pokenetes-orchestrator:${{ github.sha }} 722500516562.dkr.ecr.us-east-1.amazonaws.com/pokenetes-orchestrator:latest
          docker push 722500516562.dkr.ecr.us-east-1.amazonaws.com/pokenetes-orchestrator:latest
          curl -sLO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          aws eks update-kubeconfig --name pokenetes-test --region us-east-1
          ./kubectl -n pokenetes rollout restart deployment/pokenetes-orchestrator
          ./kubectl -n pokenetes rollout status deployment/pokenetes-orchestrator --timeout=180s
