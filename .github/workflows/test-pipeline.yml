name: Test Environment Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run coverage gate
        run: npm run test:coverage

      - name: Verify coverage threshold
        run: |
          node -e "const fs=require('fs'); const gate=require('./coverage-gates.json').test; const pct=JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8')).total.lines.pct; console.log('Coverage: '+pct+'% (gate: '+gate+'%)'); if(pct<gate){console.error('Coverage gate failed: '+pct+'% < '+gate+'%'); process.exit(1)}"

      - name: Build Docker image
        run: docker build -t pokenetes-api:${{ github.sha }} .

      - name: Deploy API to EKS
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Push API image and restart pods
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 722500516562.dkr.ecr.us-east-1.amazonaws.com
          docker tag pokenetes-api:${{ github.sha }} 722500516562.dkr.ecr.us-east-1.amazonaws.com/pokenetes-api:latest
          docker push 722500516562.dkr.ecr.us-east-1.amazonaws.com/pokenetes-api:latest
          curl -sLO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          aws eks update-kubeconfig --name pokenetes-test --region us-east-1
          ./kubectl -n pokenetes rollout restart deployment/pokenetes-api
          ./kubectl -n pokenetes rollout status deployment/pokenetes-api --timeout=180s

      - name: Deploy to Render (Test)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dev'
        env:
          RENDER_HOOK: ${{ secrets.RENDER_TEST_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "RENDER_TEST_DEPLOY_HOOK is not set. Skipping Render."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_HOOK"
