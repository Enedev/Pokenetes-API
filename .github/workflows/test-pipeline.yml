name: Test Environment Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run coverage gate
        run: npm run test:coverage

      - name: Verify coverage threshold
        run: |
          node -e "const fs=require('fs'); const gate=require('./coverage-gates.json').test; const pct=JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8')).total.lines.pct; console.log('Coverage: '+pct+'% (gate: '+gate+'%)'); if(pct<gate){console.error('Coverage gate failed: '+pct+'% < '+gate+'%'); process.exit(1)}"

      - name: Deploy to Render (Test)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dev'
        env:
          RENDER_HOOK: ${{ secrets.RENDER_TEST_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "Missing GitHub secret RENDER_TEST_DEPLOY_HOOK"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_HOOK"
