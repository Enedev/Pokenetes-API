name: Chaos Gate

on:
  workflow_dispatch:
    inputs:
      resilience:
        description: 0 runs round 0 without the new protections. 1 runs round 1 with timeout and circuit breaker.
        required: true
        type: choice
        options:
          - "0"
          - "1"
      api_url:
        description: URL of the coordinator.
        required: false
        default: "http://pokenetes-alb-1190353326.us-east-1.elb.amazonaws.com"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar el perfil k6 común
        uses: actions/checkout@v4
        with:
          repository: PholCast/biblio-express
          ref: 7b2aef79f872ff9e715c62aa59e49d085b6cd841
          path: perfil-k6
          token: ${{ secrets.PHOL_REPO_TOKEN }}
          persist-credentials: false

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Ronda con perfil-comun-v1
        env:
          API_URL: ${{ inputs.api_url }}
          RESILIENCE: ${{ inputs.resilience }}
        run: |
          mkdir -p chaos/reports
          if [ "$RESILIENCE" = "1" ]; then
            ROUND=ronda-1
            EXTRA_ARG=(-e EXTRA_HEADERS='{"x-peer-resilience":"true"}')
          else
            ROUND=ronda-0
            EXTRA_ARG=()
          fi
          k6 run \
            -e BASE_URL="$API_URL" \
            -e FLOW_PATH=/api/v5/flujo \
            -e EXPERIMENT=latencia-saliente \
            -e ROUND="$ROUND" \
            -e FAULT_HEADERS='{"x-peer-latency-ms":"2000"}' \
            "${EXTRA_ARG[@]}" \
            -e OBJECTIVE_METRIC='http_req_duration{phase:fault}' \
            -e OBJECTIVE_EXPR='p(95)<=800' \
            -e SUMMARY_PATH=chaos/reports/k6-summary.json \
            perfil-k6/load/k6/flow.js

      - name: Explicar el resultado del umbral
        if: always()
        run: node scripts/chaos/gate.mjs chaos/reports/k6-summary.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-gate-${{ github.run_id }}
          path: chaos/reports/
