experiment: neithan-outbound-latency
owner: Neithan
service: pokenetes-api
fault: latency on the outbound call to biblio-express
target_call: GET https://biblio-express-final-api-cruuw4ggmq-uc.a.run.app/api/v5/books/last
entry: GET /api/v5/flujo
profile: chaos/profile.json
steady_state:
  metric: http_req_duration_p95_ms
  instrument: k6 http_req_duration p(95) on GET /api/v2/flujo
  window: perfil-comun-v1, fault window from second 150 for 120 seconds
  threshold_ms: 800
hypothesis: >
  Given profile perfil-comun-v1, when 2000 ms of latency is injected on the
  outbound books/last call, the flujo p95 stays under 800 ms.
method:
  switch: header x-peer-latency-ms
  resilience_switch: header x-peer-resilience
  fallback: env PEER_LATENCY_MS and PEER_RESILIENCE
  latency_ms: 2000
  timeout_ms: 300
  breaker_failures: 3
  breaker_open_ms: 15000
  peer: biblio-express
round_0:
  resilience: false
  protections_absent:
    - per-dependency timeout
    - circuit breaker
blast_radius: only the coordinator outbound call to Phol. The pokemon read and the hospital call are not delayed.
duration: 120s inside perfil-comun-v1
abort:
  - coordinator /health failing
  - p95 above 5000 ms for the whole window
rollback:
  - remove x-peer-latency-ms and x-peer-resilience
  - the next request no longer delays or degrades the book step
patterns_after_diagnosis:
  - timeout of 300 ms around the book call, so the coordinator stops waiting
  - circuit breaker that opens after 3 failed book calls and skips that dependency for 15 s
discarded:
  - retries with backoff, because each retry would wait on the same injected delay and create a retry storm
