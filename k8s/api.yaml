apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokenetes-api
  namespace: pokenetes
  labels:
    app: pokenetes-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pokenetes-api
  template:
    metadata:
      labels:
        app: pokenetes-api
    spec:
      containers:
        - name: api
          image: 722500516562.dkr.ecr.us-east-1.amazonaws.com/pokenetes-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: pokenetes-config
            - secretRef:
                name: pokenetes-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pokenetes-api
  namespace: pokenetes
spec:
  type: LoadBalancer
  selector:
    app: pokenetes-api
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pokenetes-api
  namespace: pokenetes
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pokenetes-api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
