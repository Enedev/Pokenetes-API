id: exp1-identidad
title: Credencial del rol pokenetes-api-instance usada desde fuera de AWS
owner: Neithan
layer: identidad
control_under_test: rol IAM pokenetes-api-instance con sus politicas tal como estan hoy
adverse_condition: credenciales temporales usadas desde un origen fuera de AWS y con un alcance no previsto (lectura del secreto y enumeracion)
hypothesis: "Dado el control rol IAM pokenetes-api-instance con sus políticas tal como están hoy, cuando sus credenciales temporales se usen desde un origen fuera de AWS y con un alcance no previsto (lectura del secreto y enumeración), esperamos la señal alarma de uso anómalo de la identidad en CloudWatch en ≤ 15 min, y la contención (la credencial deja de servir desde ese origen) en ≤ 20 min."
expected_signal: alarma de uso anomalo de la identidad en CloudWatch
