services:
  db:
    image: postgres:16-alpine
    container_name: pokenetes-db
    environment:
      POSTGRES_USER: pokenetes
      POSTGRES_PASSWORD: pokenetes
      POSTGRES_DB: pokenetes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokenetes -d pokenetes"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pokenetes-api
    ports:
      - "3000:3000"
    env_file:
      - .env.test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://pokenetes:pokenetes@db:5432/pokenetes
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
